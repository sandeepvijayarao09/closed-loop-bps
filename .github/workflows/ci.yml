name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (CPU torch)
        run: |
          pip install "torch==$(grep '^torch==' requirements.lock | cut -d= -f3)" --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch==' requirements.lock > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Build C++ decoder loop
        run: make -C rt CXX=g++
      - name: Tests (synthetic data; no dataset download)
        run: pytest -q tests
