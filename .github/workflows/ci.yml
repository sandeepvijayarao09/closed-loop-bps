name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn h5py matplotlib pytest
      - name: Build C++ decoder loop
        run: make -C rt CXX=g++
      - name: Tests (synthetic data; no dataset download)
        run: pytest -q tests
